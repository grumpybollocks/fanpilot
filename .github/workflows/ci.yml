name: CI
on:
  push:
    branches: [main]            # feature branches are tested through their pull request
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"            # PySide6 6.12.0 breaks Python < 3.12 (see install.sh): what users get there
            pyside: "PySide6>=6.5,<6.12"
          - python: "3.13"
            pyside: "PySide6>=6.5"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install "${{ matrix.pyside }}"
      - run: python -m unittest discover -s tests -t .

  tests-without-qt:            # Ubuntu 24.04 / Debian 12 have no PySide6: the service must still be fully tested
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: FANPILOT_NO_QT=1 python -m unittest discover -s tests -t .

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: nFPM (checksum-verified release)
        run: |
          V=2.49.0
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v$V/nfpm_${V}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v$V/checksums.txt"
          grep " nfpm_${V}_Linux_x86_64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf "nfpm_${V}_Linux_x86_64.tar.gz" nfpm
      - run: packaging/build-packages.sh ./nfpm
      - name: Install the .deb on Ubuntu and run it under systemd
        run: |
          sudo apt-get install -y ./dist/fanpilot_*_all.deb
          getent group fanpilot
          fanpilotctl report > /tmp/report.json && python3 -c 'import json; json.load(open("/tmp/report.json"))'
          sudo systemctl start fanpilotd
          sleep 3
          systemctl is-active fanpilotd
          sudo fanpilotctl status
          sudo systemctl stop fanpilotd
          sudo apt-get remove -y fanpilot
      - name: Install the .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest bash -euc '
            dnf install -y --setopt=install_weak_deps=False /dist/fanpilot-*.noarch.rpm
            getent group fanpilot
            fanpilotctl report > /tmp/r.json && python3 -c "import json; json.load(open(\"/tmp/r.json\"))"
            fanpilotd --help >/dev/null'
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
