[build-system]
requires = ["setuptools>=77"]          # SPDX license string + license-files
build-backend = "setuptools.build_meta"

[project]
name = "fanpilot"
dynamic = ["version"]
description = "Safe fan control for Linux desktops: motherboard (hwmon) and graphics card fans, HWiNFO-style sensors"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []                      # the service and the CLI need only Python's standard library
keywords = ["fan", "fan-control", "hwmon", "amdgpu", "sensors", "linux"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
gui = [                                # the desktop app (distro package where available)
    "PySide6>=6.5; python_version >= '3.12'",
    "PySide6>=6.5,<6.12; python_version < '3.12'",   # 6.12.0 crashes on Python < 3.12 (None refcount)
]

[project.scripts]
fanpilotd = "fanpilot.daemon:main"
fanpilotctl = "fanpilot.ctl:main"

[project.gui-scripts]
fanpilot = "fanpilot.gui:main"

[tool.setuptools]
packages = ["fanpilot"]

[tool.setuptools.dynamic]
version = {attr = "fanpilot.__version__"}
